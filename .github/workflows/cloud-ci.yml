name: Cloud research CI
on:
  push:
    paths: ['cloud/**', 'static/js/cloud_research.js', '.github/workflows/cloud-ci.yml']
  pull_request:
    paths: ['cloud/**', 'static/js/cloud_research.js', '.github/workflows/cloud-ci.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloud
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: cloud/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
      - run: npm run typecheck
