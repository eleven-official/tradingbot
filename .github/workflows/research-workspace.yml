name: Research workspace regression checks

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: research-workspace-${{ github.ref }}
  cancel-in-progress: true

jobs:
  focused-tests:
    name: Offline research and paper execution (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      PYTHONUTF8: "1"
      MPLBACKEND: Agg

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements_test.txt

      - name: Install research and paper test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements_test.txt
          python -m pip check

      - name: Run focused offline regressions
        # These tests never construct a Tk window, contact an exchange or place
        # broker orders. Override legacy coverage addopts for this small suite.
        shell: python
        run: |
          import subprocess
          import sys

          tests = [
              "tests/test_ai_paper.py",
              "tests/test_api.py",
              "tests/test_binance_market_data.py",
              "tests/test_bot_copilot.py",
              "tests/test_broker_alpaca.py",
              "tests/test_broker_link.py",
              "tests/test_copilot.py",
              "tests/test_copilot_conversation.py",
              "tests/test_copilot_fusion_safety.py",
              "tests/test_daily_risk.py",
              "tests/test_deployment_config.py",
              "tests/test_exit_upgrades.py",
              "tests/test_fusion_api.py",
              "tests/test_fusion_council.py",
              "tests/test_fusion_external.py",
              "tests/test_fusion_portfolio.py",
              "tests/test_fusion_provenance.py",
              "tests/test_fusion_quant.py",
              "tests/test_fx_rate.py",
              "tests/test_game_dive.py",
              "tests/test_infra_stubs.py",
              "tests/test_mode_conversation.py",
              "tests/test_news_desk.py",
              "tests/test_paper_agent.py",
              "tests/test_paper_models.py",
              "tests/test_profile.js",
              "tests/test_pullback_research.py",
              "tests/test_real_account.py",
              "tests/test_real_execution.py",
              "tests/test_risk_planner.py",
              "tests/test_simulated_market.py",
              "tests/test_site_access.py",
              "tests/test_strategy_backtest.py",
              "tests/test_strategy_lab.js",
              "tests/test_strategy_lab.py",
              "tests/test_trade_council.py",
              "tests/test_trainer.py",
              "tests/test_v8_upgrades.py",
              "tests/test_watchtower.py",
          ]
          subprocess.run(
              [sys.executable, "-m", "pytest", "-o", "addopts=", "--strict-markers", "--tb=short", "-q", *[t for t in tests if t.endswith(".py")]],
              check=True,
          )
          subprocess.run(
              ["node", "--test", *[t for t in tests if t.endswith(".js")]],
              check=True,
          )
