name: Loki Trading Platform - CI/CD

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:
  release:
    types: [ published ]

env:
  PYTHON_VERSION: '3.12'
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test:
    name: Run Tests
    runs-on: ${{ matrix.os }}
    strategy:
      # One leg failing must not mask the others' results.
      fail-fast: false
      matrix:
        # ubuntu runs the site in production (Vercel); windows covers the
        # desktop path. macOS hosted runners have been unavailable for long
        # stretches (capacity), which cancelled the run and blocked shipping,
        # so the leg is disabled until it is dependable again.
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.12']
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v7
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Cache dependencies
      uses: actions/cache@v5
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements*.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements_test.txt
        pip check
    
    - name: Lint with flake8
      run: |
        flake8 loki --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 loki --count --exit-zero --max-complexity=10 --max-line-length=100 --statistics
    
    - name: Check code formatting with black
      run: black --check main.py
    
    - name: Type check with mypy
      run: mypy loki
      continue-on-error: true
    
    - name: Run tests with pytest
      run: |
        pytest tests/ --cov=loki --cov-report=xml --cov-report=html --cov-report=term-missing -v
      env:
        PYTHONPATH: .
    
    - name: Test browser profile and research agent logic
      run: node --test tests/test_profile.js tests/test_strategy_lab.js tests/test_ai_trading.js

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v7
      with:
        files: ./coverage.xml
        flags: unittests
        name: codecov-${{ matrix.os }}-py${{ matrix.python-version }}
  
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v7
    
    - name: Run Bandit security scan
      run: |
        pip install bandit
        bandit -r loki -f json -o bandit-report.json
      continue-on-error: true
    
    - name: Run Safety check
      run: |
        pip install safety
        safety check --json
      continue-on-error: true
  
  build-docker:
    name: Build and smoke-test unified container
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      packages: write
    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build the complete web runtime
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./Dockerfile.production
        load: true
        tags: loki-ci:${{ github.sha }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Verify container startup, assets and private API boundary
      run: |
        docker run -d --name loki-smoke -p 127.0.0.1:8000:8000 loki-ci:${{ github.sha }}
        python - <<'PY'
        import json
        import time
        from urllib.request import Request, urlopen
        from urllib.error import HTTPError, URLError
        base = "http://127.0.0.1:8000"
        for attempt in range(30):
            try:
                with urlopen(base + "/health", timeout=2) as response:
                    assert json.load(response)["status"] == "ok"
                break
            except (OSError, URLError):
                if attempt == 29:
                    raise
                time.sleep(1)
        for path in ("/", "/paper-tools", "/research-desk",
                     "/static/css/style.css",
                     "/static/css/paper_tools.css", "/static/js/workspace.js",
                     "/static/vendor/chartjs/chart.umd.js"):
            with urlopen(Request(base + path, headers={"Accept": "text/html"}), timeout=10) as response:
                assert response.status == 200, path
        with urlopen(base + "/api/fusion/capabilities") as response:
            capabilities = json.load(response)
            assert not capabilities["local_actions_enabled"]
            assert "local_token" not in capabilities
        try:
            urlopen(base + "/terminal/api/status")
            raise AssertionError("Removed terminal engine endpoint is still reachable")
        except HTTPError as error:
            assert error.code == 404
        print("Container startup, all interface assets and private API boundary passed.")
        PY

    - name: Container diagnostics and cleanup
      if: always()
      run: |
        docker logs loki-smoke || true
        docker rm -f loki-smoke || true

    # Registry publication remains a deliberate release action, not a PR/main push.
    - name: Log in to Container Registry for release
      if: github.event_name == 'release'
      uses: docker/login-action@v4
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Extract release metadata
      if: github.event_name == 'release'
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        tags: |
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}
          type=sha

    - name: Publish release image
      if: github.event_name == 'release'
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./Dockerfile.production
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha

  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'release'
    environment:
      name: production
      url: https://loki-joshua-5183.vercel.app

    steps:
    - name: Checkout code
      uses: actions/checkout@v7
    - name: Production is served by the Vercel git integration
      # Every push to main reaches https://loki-joshua-5183.vercel.app through
      # the connected Vercel project; this job only records the release gate.
      run: echo "Vercel ships main automatically; no kubectl step is used."
