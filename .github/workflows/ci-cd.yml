name: Loki Trading Platform - CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  release:
    types: [published]

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test:
    name: Run Tests (${{ matrix.os }}, ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.12"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements_enhanced.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -r requirements_enhanced.txt
          python -m pip install pytest pytest-cov pytest-asyncio black flake8 mypy

      - name: Lint for syntax errors
        run: |
          python -m flake8 loki --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Check formatting for maintained API code
        run: |
          python -m black --check --diff loki/api/server.py loki/portfolio.py tests/test_portfolio.py

      - name: Type check
        run: python -m mypy loki --ignore-missing-imports
        continue-on-error: true

      - name: Run tests
        run: |
          python -m pytest tests/ --cov=loki --cov-report=xml --cov-report=html --cov-report=term-missing -v

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: ./coverage.xml
          flags: unittests
          name: codecov-${{ matrix.os }}-py${{ matrix.python-version }}
          fail_ci_if_error: false

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Run Bandit security scan
        run: |
          python -m pip install bandit
          python -m bandit -r loki -f json -o bandit-report.json
        continue-on-error: true

      - name: Run Safety check
        run: |
          python -m pip install safety
          python -m safety check --json
        continue-on-error: true

  build-docker:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'release' || github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.4.1

      - name: Log in to Container Registry
        uses: docker/login-action@v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - name: Build and push Docker image
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          file: ./Dockerfile.production
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-windows-installer:
    name: Build Windows Installer
    runs-on: windows-latest
    needs: test
    if: github.event_name == 'release'

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements_enhanced.txt
          python -m pip install pyinstaller

      - name: Build Windows executable
        run: |
          pyinstaller --name="Loki-Trading-Platform" --windowed --onefile --icon=assets/loki_icon.ico loki/desktop/app.py

      - name: Create installer with NSIS
        uses: joncloud/makensis-action@v5.0
        with:
          script-file: installer/loki-installer.nsi

      - name: Upload installer artifact
        uses: actions/upload-artifact@v7
        with:
          name: loki-installer-windows
          path: installer/Loki-Setup.exe

      - name: Upload to release
        uses: softprops/action-gh-release@v3.0.3
        with:
          files: installer/Loki-Setup.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [test, build-docker]
    if: github.event_name == 'release'
    environment:
      name: production
      url: https://api.lokitrading.ai

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up kubectl
        uses: Azure/setup-kubectl@v5.2.0
        with:
          version: latest

      - name: Configure kubectl
        run: |
          echo "${{ secrets.KUBE_CONFIG }}" | base64 -d > kubeconfig.yaml
          export KUBECONFIG=kubeconfig.yaml

      - name: Deploy to Kubernetes
        run: |
          kubectl apply -f kubernetes/deployment.yaml
          kubectl rollout status deployment/loki-api -n loki-trading

      - name: Verify deployment
        run: |
          kubectl get pods -n loki-trading
          kubectl get services -n loki-trading

  notify:
    name: Notify on Completion
    runs-on: ubuntu-latest
    needs: [test, build-docker, deploy-production]
    if: always()
    env:
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

    steps:
      - name: Slack Notification
        if: env.SLACK_WEBHOOK_URL != ''
        uses: slackapi/slack-github-action@v4.0.0
        with:
          webhook: ${{ env.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            text: "Loki CI/CD Pipeline: ${{ needs.test.result }}"
