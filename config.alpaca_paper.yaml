# Free Alpaca paper-trading profile for Loki. This file can never enable live
# orders: Loki accepts only `local_paper` and `alpaca_paper` providers.

server:
  host: "127.0.0.1"
  port: 8000
  webhook_path: "/webhook/tradingview"

trading_flags:
  paper_trading: true
  risk_per_trade_percent: 1.0
  stop_loss_percent: 5.0
  max_trades_per_day: 3

risk_management:
  enable_daily_loss_limit: true
  max_daily_loss_percent: 3.0
  enable_consecutive_loss_limit: true
  max_consecutive_losses: 2
  enable_weekly_loss_limit: true
  max_weekly_loss_percent: 5.0

execution:
  provider: "alpaca_paper"
  max_order_notional_percent: 2.0
  max_gross_exposure_percent: 10.0
  max_open_positions: 3
  request_timeout_seconds: 15

# Put the actual keys in .env, never in this file or a TradingView message.
alpaca:
  api_key: "${ALPACA_PAPER_API_KEY}"
  api_secret: "${ALPACA_PAPER_API_SECRET}"
  # TradingView tickers can be mapped to the symbol Alpaca accepts.
  symbol_aliases:
    BTCUSDT: "BTC/USD"
    ETHUSDT: "ETH/USD"
    SOLUSDT: "SOL/USD"

tradingview:
  enabled: true
  # TradingView cannot create an HMAC header from Pine, so use a body token.
  auth_method: "token"
  require_signature: false
  webhook_secret: "${TRADINGVIEW_WEBHOOK_SECRET}"
  default_action: "execute"
  allowed_symbols: ["AAPL", "MSFT", "SPY", "BTCUSDT", "ETHUSDT", "SOLUSDT"]
  max_position_size: 1.0
  require_quantity: true
  max_signal_age_seconds: 300
  replay_window_seconds: 300
  max_queue_size: 100
