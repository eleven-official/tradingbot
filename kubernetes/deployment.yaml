# Kubernetes Deployment Configuration for Loki Trading Platform
apiVersion: v1
kind: Namespace
metadata:
  name: loki-trading
  labels:
    name: loki-trading
---
# ConfigMap for application configuration
apiVersion: v1
kind: ConfigMap
metadata:
  name: loki-config
  namespace: loki-trading
data:
  LOG_LEVEL: "INFO"
  LOKI_ENV: "production"
  WORKERS: "4"
---
# Secret for sensitive data (create with kubectl create secret)
apiVersion: v1
kind: Secret
metadata:
  name: loki-secrets
  namespace: loki-trading
type: Opaque
stringData:
  DATABASE_URL: "postgresql://loki:password@timescaledb-service:5432/loki_trading"
  REDIS_URL: "redis://:password@redis-service:6379/0"
  SECRET_KEY: "your-secret-key-here"
---
# TimescaleDB StatefulSet
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: timescaledb
  namespace: loki-trading
spec:
  serviceName: timescaledb-service
  replicas: 1
  selector:
    matchLabels:
      app: timescaledb
  template:
    metadata:
      labels:
        app: timescaledb
    spec:
      containers:
      - name: timescaledb
        image: timescale/timescaledb:latest-pg15
        ports:
        - containerPort: 5432
          name: postgres
        env:
        - name: POSTGRES_DB
          value: "loki_trading"
        - name: POSTGRES_USER
          value: "loki"
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: loki-secrets
              key: DB_PASSWORD
        volumeMounts:
        - name: timescaledb-storage
          mountPath: /var/lib/postgresql/data
        resources:
          requests:
            memory: "2Gi"
            cpu: "1000m"
          limits:
            memory: "4Gi"
            cpu: "2000m"
  volumeClaimTemplates:
  - metadata:
      name: timescaledb-storage
    spec:
      accessModes: ["ReadWriteOnce"]
      resources:
        requests:
          storage: 50Gi
---
# TimescaleDB Service
apiVersion: v1
kind: Service
metadata:
  name: timescaledb-service
  namespace: loki-trading
spec:
  selector:
    app: timescaledb
  ports:
  - port: 5432
    targetPort: 5432
  clusterIP: None
---
# Redis Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: loki-trading
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
      - name: redis
        image: redis:7-alpine
        ports:
        - containerPort: 6379
        command: ["redis-server", "--requirepass", "$(REDIS_PASSWORD)"]
        env:
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: loki-secrets
              key: REDIS_PASSWORD
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "500m"
---
# Redis Service
apiVersion: v1
kind: Service
metadata:
  name: redis-service
  namespace: loki-trading
spec:
  selector:
    app: redis
  ports:
  - port: 6379
    targetPort: 6379
---
# Loki API Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: loki-api
  namespace: loki-trading
spec:
  replicas: 3
  selector:
    matchLabels:
      app: loki-api
  template:
    metadata:
      labels:
        app: loki-api
    spec:
      containers:
      - name: loki-api
        image: lokitrading/loki:2.0.0  # Replace with your registry
        ports:
        - containerPort: 8000
          name: http
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: loki-secrets
              key: DATABASE_URL
        - name: REDIS_URL
          valueFrom:
            secretKeyRef:
              name: loki-secrets
              key: REDIS_URL
        - name: SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: loki-secrets
              key: SECRET_KEY
        envFrom:
        - configMapRef:
            name: loki-config
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 5
        resources:
          requests:
            memory: "2Gi"
            cpu: "1000m"
          limits:
            memory: "4Gi"
            cpu: "2000m"
---
# Loki API Service
apiVersion: v1
kind: Service
metadata:
  name: loki-api-service
  namespace: loki-trading
spec:
  selector:
    app: loki-api
  ports:
  - port: 80
    targetPort: 8000
  type: LoadBalancer
---
# Horizontal Pod Autoscaler
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: loki-api-hpa
  namespace: loki-trading
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: loki-api
  minReplicas: 3
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
---
# Ingress for external access
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: loki-ingress
  namespace: loki-trading
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  tls:
  - hosts:
    - api.lokitrading.ai
    secretName: loki-tls-secret
  rules:
  - host: api.lokitrading.ai
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: loki-api-service
            port:
              number: 80
