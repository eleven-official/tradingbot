quantum_trading:
  version: "2.0.0"
  environment: production
  
  exchanges:
    primary: binance
    backup: [bybit, kraken]
    api_keys:
      binance:
        api_key: ${BINANCE_API_KEY}
        api_secret: ${BINANCE_API_SECRET}
        testnet: ${BINANCE_TESTNET}
      bybit:
        api_key: ${BYBIT_API_KEY}
        api_secret: ${BYBIT_API_SECRET}
      kraken:
        api_key: ${KRAKEN_API_KEY}
        api_secret: ${KRAKEN_API_SECRET}
    use_testnet: true
  
  trading:
    symbols: [BTCUSDT, ETHUSDT, XRPUSDT, ADAUSDT, SOLUSDT, MATICUSDT, DOTUSDT]
    max_positions: 5
    position_size_percent: 0.02
    max_risk_per_trade: 0.01
    global_risk_limit: 0.05
    base_currency: AUD
    leverage: 1
    margin_mode: isolated
  
  neural_mutation:
    enabled: true
    population_size: 50
    mutation_rate: 0.1
    selection_pressure: 0.7
    evolution_interval_hours: 1
    elite_count: 5
    crossover_rate: 0.8
  
  backtesting:
    shadow_count: 10
    lookback_days: 30
    min_trades_required: 20
    degradation_threshold: 0.2
    parallel_backtests: 5
  
  mcp:
    tv_enabled: true
    tv_server_url: ${TRADINGVIEW_SERVER_URL}
    reconnect_interval: 30
    webhook_secret: ${TRADINGVIEW_WEBHOOK_SECRET}
    screener_enabled: true
    macro_events_enabled: true
  
  toxicity_filter:
    enabled: true
    vpin_threshold: 0.3
    imbalance_threshold: 0.6
    freeze_duration_minutes: 5
    spoofing_threshold: 0.7
    spread_threshold: 0.5
  
  sor:
    enabled: true
    iceberg_slices: 10
    randomize_venues: true
    min_order_size: 0.001
    max_slippage_percent: 0.1
    venue_fees:
      binance: 0.001
      bybit: 0.001
      kraken: 0.0016
  
  risk_topology:
    kelly_enabled: true
    var_enabled: true
    circuit_breaker_enabled: true
    max_drawdown_percent: 10.0
    hourly_loss_limit_percent: 2.0
    emergency_kill_enabled: true
    daily_loss_limit_percent: 5.0
    var_confidence: 0.99
    lookback_window: 1000
  
  indicators:
    min_confluence: 0.7
    multi_timeframe_required: true
    volume_confirmation_required: true
    volatility_confirmation_required: true
    timeframes: [1m, 5m, 15m, 1h, 4h]
  
  dashboard:
    enabled: true
    port: 8080
    update_interval: 1
    enable_websocket: true
    enable_rest_api: true
  
  chaos_testing:
    enabled: true
    interval_hours: 24
    black_san_scenarios:
      - liquidity_evaporation
      - api_latency
      - flash_crash
      - exchange_disconnect
      - order_rejection
      - data_corruption
      - network_partition
  
  logging:
    level: INFO
    file: quantum_trading.log
    max_size: 10485760
    backup_count: 5
    format: "%(asctime)s [%(levelname)s] %(name)s - %(message)s"
  
  database:
    url: sqlite:///quantum_trading.db
    pool_size: 10
    max_overflow: 20
    echo: false
  
  notifications:
    telegram:
      enabled: false
      bot_token: ${TELEGRAM_BOT_TOKEN}
      chat_id: ${TELEGRAM_CHAT_ID}
    slack:
      enabled: false
      webhook_url: ${SLACK_WEBHOOK_URL}
    email:
      enabled: false
      smtp_host: ${EMAIL_SMTP_HOST}
      smtp_port: ${EMAIL_SMTP_PORT}
      username: ${EMAIL_USERNAME}
      password: ${EMAIL_PASSWORD}
      from: ${EMAIL_FROM}
      to: ${EMAIL_TO}
  
  system:
    timezone: Australia/Sydney
    startup_mode: headless
    auto_restart: true
    max_restart_attempts: 3
    health_check_interval: 30
    metrics_collection_interval: 60
  
  advanced_features:
    mean_reversion_mode: true
    trend_following_mode: true
    arbitrage_mode: false
    grid_trading_mode: false
    dca_mode: false
    trailing_stop_enabled: true
    take_profit_steps: 3
    partial_take_profit: true
