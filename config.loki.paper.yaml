server:
  host: 0.0.0.0
  port: 8000
  webhook_path: /webhook/tradingview

trading_flags:
  paper_trading: true
  risk_per_trade_percent: 1.0
  stop_loss_percent: 5.0
  max_trades_per_day: 3

risk_management:
  enable_daily_loss_limit: true
  max_daily_loss_percent: 3.0
  enable_consecutive_loss_limit: true
  max_consecutive_losses: 2
  enable_weekly_loss_limit: true
  max_weekly_loss_percent: 5.0

execution:
  provider: local_paper
  cost_stress_multiplier: 1.0
  execution_random_seed: 7
  max_order_notional_percent: 2.0
  max_gross_exposure_percent: 10.0
  max_symbol_exposure_percent: 5.0
  max_open_positions: 3
  request_timeout_seconds: 15

paper_broker:
  initial_cash: 100000
  currency: AUD
  fee_bps: 10
  slippage_bps: 3
  state_file: state/loki_paper_account.json
  allow_short: false

tradingview:
  enabled: true
  webhook_secret: ${TRADINGVIEW_WEBHOOK_SECRET}
  require_signature: false
  auth_method: token
  default_action: execute
  allowed_symbols: [BTCUSDT, ETHUSDT, SOLUSDT, BTC/USD, ETH/USD]
  max_position_size: 1.0
  require_quantity: true
  max_signal_age_seconds: 300
  replay_window_seconds: 300
  max_queue_size: 100
