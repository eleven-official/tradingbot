version: '3.8'

services:
  # PostgreSQL/TimescaleDB database
  timescaledb:
    image: timescale/timescaledb:latest-pg15
    container_name: loki-timescaledb
    environment:
      POSTGRES_DB: loki_trading
      POSTGRES_USER: loki
      POSTGRES_PASSWORD: ${DB_PASSWORD:-loki_secure_password}
      POSTGRES_INITDB_ARGS: "-c shared_preload_libraries=timescaledb"
    ports:
      - "5432:5432"
    volumes:
      - timescaledb-data:/var/lib/postgresql/data
      - ./scripts/init-timescaledb.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - loki-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U loki"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis for caching and message broker
  redis:
    image: redis:7-alpine
    container_name: loki-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - loki-network
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-redis_secure_password}
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Loki API Server
  loki-api:
    build:
      context: .
      dockerfile: Dockerfile.production
    container_name: loki-api
    environment:
      DATABASE_URL: postgresql://loki:${DB_PASSWORD:-loki_secure_password}@timescaledb:5432/loki_trading
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis_secure_password}@redis:6379/0
      SECRET_KEY: ${SECRET_KEY:-change-this-in-production}
      LOKI_ENV: production
      LOG_LEVEL: INFO
    ports:
      - "8000:8000"
    volumes:
      - ./logs:/app/logs
      - ./state:/app/state
    networks:
      - loki-network
    depends_on:
      timescaledb:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 4G
        reservations:
          cpus: '1'
          memory: 2G

  # Celery Worker for background tasks
  loki-worker:
    build:
      context: .
      dockerfile: Dockerfile.production
    container_name: loki-worker
    command: celery -A loki.tasks.worker worker --loglevel=info --concurrency=4
    environment:
      DATABASE_URL: postgresql://loki:${DB_PASSWORD:-loki_secure_password}@timescaledb:5432/loki_trading
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis_secure_password}@redis:6379/0
      SECRET_KEY: ${SECRET_KEY:-change-this-in-production}
      LOKI_ENV: production
    volumes:
      - ./logs:/app/logs
      - ./state:/app/state
    networks:
      - loki-network
    depends_on:
      - timescaledb
      - redis
      - loki-api
    restart: unless-stopped

  # Celery Beat for scheduled tasks
  loki-beat:
    build:
      context: .
      dockerfile: Dockerfile.production
    container_name: loki-beat
    command: celery -A loki.tasks.worker beat --loglevel=info
    environment:
      DATABASE_URL: postgresql://loki:${DB_PASSWORD:-loki_secure_password}@timescaledb:5432/loki_trading
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis_secure_password}@redis:6379/0
      LOKI_ENV: production
    volumes:
      - ./logs:/app/logs
    networks:
      - loki-network
    depends_on:
      - redis
      - loki-worker
    restart: unless-stopped

  # Prometheus for metrics
  prometheus:
    image: prom/prometheus:latest
    container_name: loki-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    networks:
      - loki-network
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
    restart: unless-stopped

  # Grafana for visualization
  grafana:
    image: grafana/grafana:latest
    container_name: loki-grafana
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_INSTALL_PLUGINS: grafana-clock-panel
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources
    networks:
      - loki-network
    depends_on:
      - prometheus
    restart: unless-stopped

  # Nginx reverse proxy
  nginx:
    image: nginx:alpine
    container_name: loki-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    networks:
      - loki-network
    depends_on:
      - loki-api
    restart: unless-stopped

networks:
  loki-network:
    driver: bridge

volumes:
  timescaledb-data:
  redis-data:
  prometheus-data:
  grafana-data:
