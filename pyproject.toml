[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "loki-trading-platform"
dynamic = ["version"]
description = "Enterprise-grade AI-powered algorithmic trading platform"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "Proprietary"}
authors = [
    {name = "Loki Trading Systems", email = "support@lokitrading.ai"}
]
keywords = ["trading", "algorithmic-trading", "machine-learning", "finance", "quantitative-finance"]
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "jinja2>=3.1.2",
    "aiofiles>=23.1.0",
    "python-multipart>=0.0.9",
    "python-dotenv>=1.0.0",
    "structlog>=24.1.0",
]

# Runtime dependencies for the deployed site. Vercel's Python runtime installs
# from THIS table (not requirements.txt) — keep the two lists in sync.
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "jinja2>=3.1.2",
    "aiofiles>=23.1.0",
    "python-multipart>=0.0.9",
    "python-dotenv>=1.0.0",
    "structlog>=24.1.0",
    "yfinance>=0.2.40",
    "requests>=2.31.0",
]

[project.urls]
Homepage = "https://lokitrading.ai"
Documentation = "https://docs.lokitrading.ai"
Repository = "https://github.com/lokitrading/loki"
Issues = "https://github.com/lokitrading/loki/issues"

[tool.vercel]
entrypoint = "main:app"

[tool.setuptools]
packages = ["loki"]

[tool.setuptools.dynamic]
version = {attr = "loki.version.__version__"}

[tool.black]
line-length = 100
target-version = ['py312']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

# Point Vercel at the lightweight ASGI entrypoint (avoids desktop launchers).
[tool.vercel]
entrypoint = "main:app"

[tool.isort]
profile = "black"
line_length = 100
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = false
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
strict_equality = true

[tool.pytest.ini_options]
minversion = "7.0"
# Make the repo root importable so bare `pytest` (CI) can import loki,
# loki_v8, core_engine, etc. without each test file needing sys.path hacks.
pythonpath = ["."]
addopts = "-ra -q --strict-markers --cov=loki --cov-report=html --cov-report=term-missing"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
    "e2e: marks tests as end-to-end tests",
]

[tool.coverage.run]
source = ["loki"]
omit = [
    "*/tests/*",
    "*/migrations/*",
    "*/__pycache__/*",
]

[tool.coverage.report]
precision = 2
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@abstractmethod",
]

# Explicitly select the lightweight ASGI entrypoint rather than a desktop launcher.
[tool.vercel]
entrypoint = "main:app"
