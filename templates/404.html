<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="dark">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#060a12">
  <title>Loki · Page not on the map</title>
  <link rel="icon" href="/favicon.ico?v={{ version }}" sizes="any">
  <link rel="apple-touch-icon" href="/favicon.png?v={{ version }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; }
    body { min-height: 100vh; display: grid; place-items: center; background: #060a12; color: #e7f0ff; font-family: Inter, system-ui, sans-serif; padding: 24px; text-align: center; }
    .panel { max-width: 560px; }
    .depth {
      font-family: "JetBrains Mono", monospace; font-weight: 700; font-size: clamp(88px, 24vw, 150px);
      line-height: 1; letter-spacing: -0.04em;
      color: transparent; -webkit-text-stroke: 2px rgba(139, 218, 212, .4);
    }
    .depth::after { content: "404"; }
    h1 { font-size: 24px; line-height: 1.2; margin: 18px 0 10px; }
    h1 em { color: #b8f0d8; font-style: normal; }
    p.muted { color: #9fb0c2; font-size: 14px; line-height: 1.55; margin-bottom: 28px; }
    .row { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
    a.go { display: inline-block; padding: 13px 26px; border-radius: 12px; background: #baf0d8; color: #06251c; font-weight: 700; font-size: 15px; text-decoration: none; }
    a.go:hover { background: #d6f8e7; }
    a.quiet { display: inline-block; align-self: center; padding: 13px 18px; border: 1px solid rgba(139, 218, 212, .3); border-radius: 12px; color: #8bdad4; font-weight: 600; font-size: 14px; text-decoration: none; }
    a.quiet:hover { background: rgba(139, 218, 212, .1); }
    .brand { color: #7f93a8; font-size: 12px; margin-top: 26px; letter-spacing: .04em; }
    .brand b { color: #a8c0d4; }
  </style>
</head>
<body>
  <main class="panel">
    <div class="depth" aria-hidden="true"></div>
    <h1>This page isn't on the <em>map</em>.</h1>
    <p class="muted">Nothing broke — there was never a page at this address.
      Honest, at least. The desk is one click away.</p>
    <div class="row">
      <a class="go" href="/">Back to the desk →</a>
      <a class="quiet" href="/#ai">Watch the AI runner</a>
    </div>
    <p class="brand"><b>LOKI</b> · research grade, mistake resistant · v{{ version }}</p>
  </main>
</body>
</html>
