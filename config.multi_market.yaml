# Multi-Market Configuration
# Supports Equity (Zerodha), Forex (OANDA), and Futures (Interactive Brokers)

# Market Configuration
markets:
  primary_market: "equity"  # Default market for trading
  enabled_markets:
    - equity
    - forex
    # - futures  # Enable when IB adapter is fully implemented
  
  # Equity Market Configuration (Zerodha)
  equity:
    provider: "zerodha"
    api_key: "${ZERODHA_API_KEY}"
    api_secret: "${ZERODHA_API_SECRET}"
    access_token: "${ZERODHA_ACCESS_TOKEN}"
    timeout: 120
    instruments:
      - "NIFTY 50"
      - "BANKNIFTY"
      - "FINNIFTY"
  
  # Forex Market Configuration (OANDA)
  forex:
    provider: "oanda"
    hostname: "api-fxpractice.oanda.com"  # Use live hostname for production
    port: 443
    api_token: "${OANDA_API_TOKEN}"
    account_id: "${OANDA_ACCOUNT_ID}"
    instruments:
      - "EUR_USD"
      - "GBP_USD"
      - "USD_JPY"
      - "AUD_USD"
    enabled: false  # Set to true when configured
  
  # Futures Market Configuration (Interactive Brokers)
  futures:
    provider: "interactive_brokers"
    host: "127.0.0.1"
    port: 7497  # Paper trading port
    client_id: 1
    enabled: false  # Set to true when IB adapter is fully implemented

# TradingView Bridge Configuration
tradingview:
  enabled: true
  webhook_port: 5000
  webhook_secret: "${TRADINGVIEW_WEBHOOK_SECRET}"
  server_url: "http://localhost:5000"
  alert_validation: true

# Risk Management (Multi-Market)
risk_management:
  atr_multiplier: 2.0
  enable_daily_loss_limit: true
  enable_volatility_adjustment: true
  high_vix_risk_reduction_factor: 0.5
  high_vix_threshold: 22.0
  max_daily_loss_percent: 2.5
  enable_consecutive_loss_limit: true
  max_consecutive_losses: 3
  enable_weekly_loss_limit: false
  max_weekly_loss_percent: 5.0
  
  # Market-specific risk parameters
  market_specific_risk:
    equity:
      risk_per_trade_percent: 1.0
      stop_loss_percent: 15.0
      max_trades_per_day: 5
    forex:
      risk_per_trade_percent: 0.5  # More conservative for forex
      stop_loss_percent: 20.0    # Wider stops for forex volatility
      max_trades_per_day: 10     # More opportunities in forex
    futures:
      risk_per_trade_percent: 0.8
      stop_loss_percent: 25.0
      max_trades_per_day: 8

# Risk Tiers (Capital-based)
risk_tiers:
  - { max_capital: 100000, risk_pct: 2 }
  - { max_capital: 300000, risk_pct: 1.5 }
  - { max_capital: null,   risk_pct: 1 }

# Trading Flags
trading_flags:
  underlying_instrument: "NIFTY 50"
  chart_timeframe: "5minute"
  product_type: "MIS"
  order_variety: "REGULAR"
  risk_per_trade_percent: 1.0
  stop_loss_percent: 15.0
  max_trades_per_day: 5
  paper_trading: true  # Start with paper trading
  enable_gemini_loss_analysis: false
  enable_natural_language_prompt: false
  strategy_reassessment_period_minutes: 60
  use_rag: false
  rag_min_trading_days: 5
  multi_market_mode: true  # Enable multi-market trading

# Server Configuration
server:
  headless: false
  login_wait_minutes: 90
  dashboard_token: "test_token"
  control_pin: "1234"

# Email Configuration
email_settings:
  send_daily_report: false
  smtp_server: "smtp.gmail.com"
  smtp_port: 587
  sender_email: "your_email@gmail.com"
  sender_password: "${EMAIL_APP_PASSWORD}"
  receiver_email: "receiver_email@gmail.com"

# Reporting
reporting:
  weekly_report: false
  weekly_report_day: "Friday"

# Setup Score
setup_score:
  enable: true
  entry_threshold: 65
  size_full_above: 85
  size_min_factor: 0.75
  counter_direction_value: 0.4
  structure_target_room_points: 25.0
  structure_room_atr_mult: 2.0
  pcr_slope_min: 0.01
  daily_trend_ma_period: 20
  daily_trend_slope_bars: 5
  daily_trend_hard_block: true
  candle_level_proximity_points: 10.0
  late_window_start: "14:00"
  late_window_threshold: 80
  weights:
    direction: 20
    htf_15m: 25
    pcr: 15
    structure: 15
    momentum: 15
    day_quality: 10
    exhaustion: 18
    pcr_slope: 10
    flow_bias: 6
    daily_trend: 20
    candle: 12

# Structure Exit
structure_exit:
  enable: true
  scale_out_pct: 50
  tight_trail_pct_at_target: 8.0

# Regime
regime:
  max_trading_days_per_week: 3
  vix_no_trade_below: 12
  require_clean_regime: true
  allow_trending_in_high_vix: false

# Metrics
metrics:
  enabled: true
  prometheus_port: null
  log_metrics: true

# Performance
performance:
  enabled: true
  async_operations: true